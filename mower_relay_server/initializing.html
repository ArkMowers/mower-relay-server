<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="mower-relay-build" content="__BUILD__"><title>Mower 远程访问</title>
<style>html,body,#app{width:100%;height:100%;margin:0}body{overflow:hidden}#loading{margin:20vh auto;width:min(28rem,86vw);font:16px system-ui,sans-serif}progress{width:100%}</style></head>
<body><div id="app"><main id="loading"><h1>正在加载 Mower 界面</h1><progress aria-label="加载界面"></progress><p role="status">正在获取匹配实例版本的前端…</p><button hidden>重试</button></main></div>
<script type="module">
const origin = '__UI_ORIGIN__'
const build = '__BUILD__'
const panel = document.querySelector('#loading')
const retry = panel.querySelector('button')
retry.onclick = () => location.reload()
function asset(path) {
  if (typeof path !== 'string' || !/^\/(assets|files)\/[A-Za-z0-9_.-]+$/.test(path)) throw Error()
  return origin + path
}
try {
  const response = await fetch(origin + '/builds/' + build + '/manifest.json', {credentials:'omit',signal:AbortSignal.timeout(30000)})
  if (!response.ok) throw Error()
  const manifest = await response.json()
  if (manifest.build !== build || manifest.schema !== 1) throw Error()
  window.__MOWER_PUBLIC_ASSETS__ = Object.fromEntries(Object.entries(manifest.public).map(([name,path]) => [name,asset(path)]))
  const icon = document.createElement('link')
  icon.rel = 'icon'
  icon.href = window.__MOWER_PUBLIC_ASSETS__['/favicon.ico']
  document.head.append(icon)
  await Promise.all(manifest.styles.map(path => new Promise((ok,fail) => {
    const link = document.createElement('link')
    link.rel = 'stylesheet'; link.crossOrigin = 'anonymous'; link.onload = ok; link.onerror = fail; link.href = asset(path); document.head.append(link)
  })))
  await import(asset(manifest.entry))
} catch {
  panel.querySelector('progress').hidden = true
  panel.querySelector('h1').textContent = '暂时无法加载此版本的界面'
  panel.querySelector('p').textContent = '请检查网络，或稍后重试。'
  retry.hidden = false
}
</script></body></html>
